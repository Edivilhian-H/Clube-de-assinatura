<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clube de Assinatura</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="img-bg">
      <header>
        <div class="container">
          <img
            src="assets/logo-horizontal.svg"
            alt="Logo do Clube de Assinatura"
          />
          <button class="btn btn-primary">Assinar</button>
        </div>
      </header>

      <section id="hero">
        <div class="container">
          <h1>Desperte a sua imaginação e explore novos mundos</h1>
          <p>
            Junte-se ao clube de assinatura Encantos Literários e descubra
            maravilhas e aventuras a cada página
          </p>
        </div>
      </section>
    </div>

    <section id="information">
      <div class="container">
        <img src="./assets/img/mystery-opened-spellbook.png" alt="" />
        <div>
          <p>
            Receba todo mês um <span> livro surpresa </span> do seu tema
            favorito, acompanhado de <span> brindes exclusivos </span> que
            tornarão a sua experiência literária
            <span> encantadora </span>
          </p>
        </div>
        <div>
          <img src="./assets/img/mystery-ouija-planchette.png" alt="" />
          <img src="./assets/img/mystery-crystal-ball.png" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
